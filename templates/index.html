<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CryptoLab — César & Vigenère</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    /* ── RESET & BASE ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0a0a0f;
      --surface:  #111118;
      --border:   #1e1e2e;
      --accent:   #f0c040;
      --accent2:  #f87f23;
      --danger:   #f05060;
      --text:     #e8e8f0;
      --muted:    #6060a0;
      --mono:     'Space Mono', monospace;
      --sans:     'Syne', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── GRID BACKGROUND ── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(240,192,64,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(240,192,64,.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* ── HEADER ── */
    header {
      position: relative; z-index: 10;
      border-bottom: 1px solid var(--border);
      padding: 1.5rem 3rem;
      display: flex; align-items: center; gap: 1.5rem;
    }
    .logo {
      font-family: var(--mono);
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.03em;
    }
    .logo span { color: var(--accent2); }
    .tagline {
      font-size: .75rem;
      color: var(--muted);
      letter-spacing: .15em;
      text-transform: uppercase;
      border-left: 1px solid var(--border);
      padding-left: 1.5rem;
    }

    /* ── TABS NAV ── */
    .tabs-nav {
      position: relative; z-index: 10;
      display: flex; gap: 0;
      border-bottom: 1px solid var(--border);
      padding: 0 3rem;
    }
    .tab-btn {
      background: none; border: none; cursor: pointer;
      font-family: var(--sans); font-size: .85rem; font-weight: 700;
      color: var(--muted);
      padding: 1rem 1.5rem;
      letter-spacing: .08em; text-transform: uppercase;
      position: relative;
      transition: color .2s;
    }
    .tab-btn::after {
      content: '';
      position: absolute; bottom: -1px; left: 0; right: 0; height: 2px;
      background: var(--accent);
      transform: scaleX(0); transition: transform .2s;
    }
    .tab-btn.active { color: var(--accent); }
    .tab-btn.active::after { transform: scaleX(1); }
    .tab-btn:hover:not(.active) { color: var(--text); }

    /* ── PANELS ── */
    .panel { display: none; }
    .panel.active { display: block; }

    /* ── MAIN LAYOUT ── */
    .main-grid {
      position: relative; z-index: 5;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      height: calc(100vh - 120px);
    }

    .col {
      border-right: 1px solid var(--border);
      padding: 2rem;
      overflow-y: auto;
      display: flex; flex-direction: column; gap: 1.5rem;
    }
    .col:last-child { border-right: none; }

    /* ── SECTION LABELS ── */
    .col-label {
      font-size: .65rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex; align-items: center; gap: .75rem;
    }
    .col-label::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    /* ── FORM ELEMENTS ── */
    .field { display: flex; flex-direction: column; gap: .5rem; }
    .field label {
      font-size: .75rem; letter-spacing: .1em;
      text-transform: uppercase; color: var(--muted);
    }

    textarea, input[type="text"], input[type="number"] {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono); font-size: .9rem;
      padding: .85rem 1rem;
      border-radius: 4px;
      outline: none;
      transition: border-color .2s;
      resize: vertical;
    }
    textarea:focus, input:focus { border-color: var(--accent); }
    textarea { min-height: 120px; }

    /* ── SHIFT CONTROL ── */
    .shift-wrap {
      display: flex; align-items: center; gap: 1rem;
    }
    .shift-wrap input[type="range"] {
      flex: 1; accent-color: var(--accent);
      background: none; border: none; padding: 0;
    }
    .shift-badge {
      font-family: var(--mono); font-size: 1.4rem; font-weight: 700;
      color: var(--accent);
      min-width: 2.5rem; text-align: center;
    }

    /* ── TOGGLE ── */
    .toggle-row {
      display: flex; gap: .5rem;
    }
    .toggle-btn {
      flex: 1; background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted); cursor: pointer;
      font-family: var(--sans); font-size: .8rem; font-weight: 700;
      padding: .6rem; border-radius: 4px;
      letter-spacing: .08em; text-transform: uppercase;
      transition: all .15s;
    }
    .toggle-btn.active {
      background: var(--accent); color: var(--bg);
      border-color: var(--accent);
    }

    /* ── BUTTON ── */
    .btn-run {
      background: var(--accent); color: var(--bg);
      border: none; cursor: pointer;
      font-family: var(--sans); font-size: .85rem; font-weight: 800;
      padding: .85rem 2rem; border-radius: 4px;
      letter-spacing: .1em; text-transform: uppercase;
      transition: opacity .15s, transform .1s;
      align-self: flex-start;
    }
    .btn-run:hover { opacity: .9; }
    .btn-run:active { transform: scale(.98); }
    .btn-run.secondary {
      background: transparent;
      border: 1px solid var(--accent2);
      color: var(--accent2);
    }

    /* ── OUTPUT ── */
    .output-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      padding: 1rem;
      border-radius: 4px;
      font-family: var(--mono); font-size: .9rem;
      min-height: 80px;
      word-break: break-all;
      line-height: 1.7;
      color: var(--accent);
    }
    .output-box.empty { color: var(--muted); font-style: italic; }

    /* ── FREQUENCY CHART ── */
    .freq-chart {
      display: flex; flex-direction: column; gap: .3rem;
    }
    .freq-bar-row {
      display: flex; align-items: center; gap: .6rem; font-family: var(--mono); font-size: .75rem;
    }
    .freq-letter { color: var(--accent2); width: 1rem; text-align: center; }
    .freq-bar-bg { flex: 1; height: 10px; background: var(--border); border-radius: 2px; }
    .freq-bar-fill { height: 100%; background: var(--accent2); border-radius: 2px; transition: width .4s; }
    .freq-pct { color: var(--muted); width: 3.5rem; text-align: right; }

    /* ── IC BADGE ── */
    .ic-badge {
      display: inline-flex; align-items: center; gap: .6rem;
      background: var(--surface); border: 1px solid var(--border);
      padding: .5rem 1rem; border-radius: 4px;
      font-family: var(--mono); font-size: .85rem;
    }
    .ic-value { font-weight: 700; font-size: 1.1rem; }
    .ic-value.natural { color: #80f080; }
    .ic-value.encrypted { color: var(--accent); }

    /* ── BRUTE FORCE TABLE ── */
    .brute-table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: .8rem; }
    .brute-table th {
      text-align: left; padding: .5rem .75rem;
      color: var(--muted); font-weight: 400; letter-spacing: .1em;
      border-bottom: 1px solid var(--border);
    }
    .brute-table td {
      padding: .4rem .75rem;
      border-bottom: 1px solid rgba(30,30,46,.5);
    }
    .brute-table tr:hover td { background: rgba(240,192,64,.05); }
    .brute-table .shift-col { color: var(--accent); }
    .brute-table .text-col { color: var(--text); word-break: break-all; }

    /* ── SECURITY ANALYSIS ── */
    .security-grid {
      position: relative; z-index: 5;
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 1.5rem; padding: 2rem 3rem;
      overflow-y: auto; height: calc(100vh - 120px);
    }

    .sec-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px; padding: 1.5rem;
    }
    .sec-card-title {
      font-size: .7rem; letter-spacing: .18em;
      text-transform: uppercase; color: var(--muted);
      margin-bottom: 1rem;
    }
    .sec-card h3 {
      font-size: 1.1rem; font-weight: 800;
      margin-bottom: .75rem;
    }
    .sec-card h3.danger { color: var(--danger); }
    .sec-card h3.warn   { color: var(--accent); }
    .sec-card h3.ok     { color: #80f080; }

    .sec-card p {
      font-size: .85rem; line-height: 1.7;
      color: rgba(232,232,240,.7); margin-bottom: .6rem;
    }
    .sec-card p:last-child { margin-bottom: 0; }

    .tag-list { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .75rem; }
    .tag {
      font-size: .7rem; letter-spacing: .08em;
      padding: .25rem .6rem; border-radius: 3px;
      font-family: var(--mono);
    }
    .tag.red   { background: rgba(240,80,96,.15);  color: var(--danger); border: 1px solid rgba(240,80,96,.3); }
    .tag.yellow{ background: rgba(240,192,64,.12); color: var(--accent); border: 1px solid rgba(240,192,64,.25); }
    .tag.blue  { background: rgba(64,192,240,.12); color: var(--accent2); border: 1px solid rgba(64,192,240,.25); }

    .compare-table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    .compare-table th {
      text-align: left; padding: .6rem .75rem;
      background: rgba(240,192,64,.08);
      color: var(--accent); font-weight: 700; letter-spacing: .06em;
    }
    .compare-table td {
      padding: .5rem .75rem; border-bottom: 1px solid var(--border);
      color: rgba(232,232,240,.75);
    }
    .compare-table .prop { color: var(--muted); font-family: var(--mono); font-size: .75rem; }

    .full-width { grid-column: 1 / -1; }

    /* ── ERROR ── */
    .error-msg {
      color: var(--danger); font-size: .8rem;
      font-family: var(--mono); padding: .5rem;
    }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── COPY BTN ── */
    .copy-btn {
      background: none; border: 1px solid var(--border);
      color: var(--muted); cursor: pointer;
      font-family: var(--mono); font-size: .7rem;
      padding: .3rem .6rem; border-radius: 3px;
      transition: all .15s; float: right; margin-top: -2px;
    }
    .copy-btn:hover { border-color: var(--accent2); color: var(--accent2); }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">CRYPTO<span>LAB</span></div>
  <div class="tagline">César &amp; Vigenère Analyse cryptographique</div>
</header>

<!-- TABS -->
<nav class="tabs-nav">
  <button class="tab-btn active" onclick="switchTab('caesar')">① César</button>
  <button class="tab-btn" onclick="switchTab('vigenere')">② Vigenère</button>

  
</nav>

<!-- ══════════════════════════════════════
     PANEL 1 — CÉSAR
═══════════════════════════════════════ -->
<div id="panel-caesar" class="panel active">
  <div class="main-grid">
    <!-- INPUT -->
    <div class="col">
      <div class="col-label">Entrée</div>

      <div class="field">
        <label>Texte</label>
        <textarea id="c-text" placeholder="Saisir le texte ici...">Bonjour le monde</textarea>
      </div>

      <div class="field">
        <label>Décalage (0–25)</label>
        <div class="shift-wrap">
          <input type="range" id="c-shift-range" min="0" max="25" value="3"
                 oninput="document.getElementById('c-shift-num').value=this.value">
          <input type="number" id="c-shift-num" min="0" max="25" value="3"
                 style="width:70px"
                 oninput="document.getElementById('c-shift-range').value=this.value">
          <span class="shift-badge" id="c-shift-display">3</span>
        </div>
      </div>

      <div class="field">
        <label>Mode</label>
        <div class="toggle-row">
          <button class="toggle-btn active" id="c-enc-btn" onclick="setMode('caesar','encrypt')">🔒 Chiffrer</button>
          <button class="toggle-btn" id="c-dec-btn" onclick="setMode('caesar','decrypt')">🔓 Déchiffrer</button>
        </div>
      </div>

      <button class="btn-run" onclick="runCaesar()">Exécuter →</button>
    </div>

    <!-- OUTPUT + FREQ -->
    <div class="col">
      <div class="col-label">Résultat</div>

      <div class="field">
        <label>Texte résultat <button class="copy-btn" onclick="copyText('c-output')">copier</button></label>
        <div class="output-box empty" id="c-output">Le résultat s'affichera ici…</div>
      </div>

      <div class="ic-badge" id="c-ic" style="display:none">
        <span>Indice de Coïncidence</span>
        <span class="ic-value" id="c-ic-val">—</span>
      </div>

      <div class="field" id="c-freq-wrap" style="display:none">
        <label>Fréquence des lettres (top 10)</label>
        <div class="freq-chart" id="c-freq-chart"></div>
      </div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════
     PANEL 2 — VIGENÈRE
═══════════════════════════════════════ -->
<div id="panel-vigenere" class="panel">
  <div class="main-grid">
    <div class="col">
      <div class="col-label">Entrée</div>

      <div class="field">
        <label>Texte</label>
        <textarea id="v-text" placeholder="Saisir le texte ici...">Bonjour le monde</textarea>
      </div>

      <div class="field">
        <label>Clé (lettres uniquement)</label>
        <input type="text" id="v-key" placeholder="ex: SECRET" value="CLE">
      </div>

      <div class="field">
        <label>Mode</label>
        <div class="toggle-row">
          <button class="toggle-btn active" id="v-enc-btn" onclick="setMode('vigenere','encrypt')">🔒 Chiffrer</button>
          <button class="toggle-btn" id="v-dec-btn" onclick="setMode('vigenere','decrypt')">🔓 Déchiffrer</button>
        </div>
      </div>

      <button class="btn-run" onclick="runVigenere()">Exécuter →</button>
      <div class="error-msg" id="v-error"></div>
    </div>

    <div class="col">
      <div class="col-label">Résultat</div>

      <div class="field">
        <label>Texte résultat <button class="copy-btn" onclick="copyText('v-output')">copier</button></label>
        <div class="output-box empty" id="v-output">Le résultat s'affichera ici…</div>
      </div>

      <div class="ic-badge" id="v-ic" style="display:none">
        <span>Indice de Coïncidence</span>
        <span class="ic-value" id="v-ic-val">—</span>
      </div>

      <div class="field" id="v-freq-wrap" style="display:none">
        <label>Fréquence des lettres (top 10)</label>
        <div class="freq-chart" id="v-freq-chart"></div>
      </div>
    </div>
  </div>
</div>


<script>
  /* ── STATE ── */
  const modes = { caesar: 'encrypt', vigenere: 'encrypt' };

  /* ── TABS ── */
  function switchTab(name) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('panel-' + name).classList.add('active');
    event.target.classList.add('active');
  }

  /* ── MODE TOGGLE ── */
  function setMode(algo, mode) {
    modes[algo] = mode;
    if (algo === 'caesar') {
      document.getElementById('c-enc-btn').classList.toggle('active', mode === 'encrypt');
      document.getElementById('c-dec-btn').classList.toggle('active', mode === 'decrypt');
    } else {
      document.getElementById('v-enc-btn').classList.toggle('active', mode === 'encrypt');
      document.getElementById('v-dec-btn').classList.toggle('active', mode === 'decrypt');
    }
  }

  /* ── SHIFT DISPLAY ── */
  document.getElementById('c-shift-range').addEventListener('input', function() {
    document.getElementById('c-shift-display').textContent = this.value;
  });
  document.getElementById('c-shift-num').addEventListener('input', function() {
    document.getElementById('c-shift-display').textContent = this.value;
  });

  /* ── RENDER FREQ ── */
  function renderFreq(containerId, freqData) {
    const wrap = document.getElementById(containerId).parentElement;
    wrap.style.display = 'block';
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    const max = freqData.most_common.length ? freqData.most_common[0][1] : 1;
    freqData.most_common.forEach(([letter, pct]) => {
      const row = document.createElement('div');
      row.className = 'freq-bar-row';
      row.innerHTML = `
        <span class="freq-letter">${letter}</span>
        <div class="freq-bar-bg">
          <div class="freq-bar-fill" style="width:${(pct/max)*100}%"></div>
        </div>
        <span class="freq-pct">${pct}%</span>`;
      container.appendChild(row);
    });
  }

  /* ── RENDER IC ── */
  function renderIC(badgeId, valId, ic) {
    const badge = document.getElementById(badgeId);
    badge.style.display = 'inline-flex';
    const val = document.getElementById(valId);
    val.textContent = ic;
    val.className = 'ic-value ' + (ic > 0.065 ? 'natural' : 'encrypted');
  }

  /* ── CAESAR ── */
  async function runCaesar() {
    const text = document.getElementById('c-text').value;
    const shift = parseInt(document.getElementById('c-shift-num').value) || 3;
    const mode = modes.caesar;
    const res = await fetch('/api/caesar', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ text, shift, mode })
    });
    const data = await res.json();
    const out = document.getElementById('c-output');
    out.textContent = data.result;
    out.classList.remove('empty');
    renderFreq('c-freq-chart', data.frequency);
    document.getElementById('c-freq-wrap').style.display = 'block';
    renderIC('c-ic', 'c-ic-val', data.ic);
  }

  /* ── VIGENÈRE ── */
  async function runVigenere() {
    const text = document.getElementById('v-text').value;
    const key = document.getElementById('v-key').value;
    const mode = modes.vigenere;
    document.getElementById('v-error').textContent = '';
    const res = await fetch('/api/vigenere', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ text, key, mode })
    });
    const data = await res.json();
    if (data.error) {
      document.getElementById('v-error').textContent = data.error;
      return;
    }
    const out = document.getElementById('v-output');
    out.textContent = data.result;
    out.classList.remove('empty');
    renderFreq('v-freq-chart', data.frequency);
    document.getElementById('v-freq-wrap').style.display = 'block';
    renderIC('v-ic', 'v-ic-val', data.ic);
  }

  /* ── BRUTE FORCE ── */
  async function runBrute() {
    const text = document.getElementById('b-text').value;
    const res = await fetch('/api/caesar/brute', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ text })
    });
    const data = await res.json();
    const container = document.getElementById('b-results');
    container.innerHTML = `
      <table class="brute-table">
        <thead><tr><th>Décalage</th><th>Résultat déchiffré</th></tr></thead>
        <tbody>
          ${data.results.map(r => `
            <tr>
              <td class="shift-col">${String(r.shift).padStart(2,'0')}</td>
              <td class="text-col">${escHtml(r.text)}</td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  }

  /* ── UTILS ── */
  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function copyText(id) {
    const txt = document.getElementById(id).textContent;
    navigator.clipboard.writeText(txt).then(() => {
      const btn = event.target; btn.textContent = 'copié !';
      setTimeout(() => btn.textContent = 'copier', 1500);
    });
  }
</script>
</body>
</html>
